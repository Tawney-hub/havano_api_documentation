<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havano POS API</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    /* Minimal Navbar */
    header.nav {
      background: var(--bg);
      padding: 0.65rem 1.25rem;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      background: var(--primary);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Editable Server Input */
    .server-box {
      display: flex;
      align-items: center;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 0.2rem 0.5rem;
      gap: 0.4rem;
    }

    .server-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .server-label {
      color: #64748b;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .server-input {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      width: 240px;
      outline: none;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.35rem 0.7rem;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-dark {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .btn-dark:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Tags Bar */
    .tags-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 1.25rem;
      display: flex;
      gap: 0.3rem;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .tag-btn {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      cursor: pointer;
      text-decoration: none;
    }

    .tag-btn:hover {
      color: #fff;
    }

    .tag-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Swagger Container */
    #swagger-ui {
      max-width: 1280px;
      margin: 0.5rem auto 3rem;
      padding: 0 1rem;
    }

    /* HIDE Swagger UI default bulky header blocks (info, description, servers dropdown) */
    .swagger-ui .information-container,
    .swagger-ui .scheme-container,
    .swagger-ui .info {
      display: none !important;
    }

    .swagger-ui .opblock {
      border-radius: 5px;
      margin-bottom: 6px;
    }
    .swagger-ui .opblock .opblock-summary-method {
      border-radius: 3px;
      font-weight: 700;
      min-width: 65px;
      font-size: 0.75rem;
    }
    .swagger-ui .opblock .opblock-summary-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }

    /* Auth Modal */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-box {
      background: #1e293b;
      color: #fff;
      border-radius: 8px;
      max-width: 400px;
      width: 100%;
      padding: 1.25rem;
      border: 1px solid #334155;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .modal-input {
      width: 100%;
      padding: 0.5rem 0.7rem;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 5px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      margin-bottom: 0.6rem;
    }
    .modal-input:focus {
      outline: none;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <!-- Clean Top Nav -->
  <header class="nav">
    <div class="brand">
      <div class="brand-icon">H</div>
      <span>Havano POS API</span>
    </div>

    <div class="server-box" title="Server URL for live API execution">
      <span class="server-dot"></span>
      <span class="server-label">Server</span>
      <input type="text" id="targetServerUrl" class="server-input" value="https://backoffice.havano.pro" spellcheck="false" onchange="onServerChange()">
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="openAuthModal()">Authorize</button>
      <a href="openapi.json" download="openapi.json" class="btn btn-dark">JSON</a>
    </div>
  </header>

  <!-- Tag Category Tabs (Frappe Core First & Auto-Selected) -->
  <nav class="tags-bar" id="tagNav">
    <button class="tag-btn active" onclick="filterByTag('Frappe Core APIs', this)">Frappe Core APIs</button>
    <button class="tag-btn" onclick="filterByTag('all', this)">All</button>
    <button class="tag-btn" onclick="filterByTag('Auth & Terminals', this)">Auth & Terminals</button>
    <button class="tag-btn" onclick="filterByTag('Products & Bundles', this)">Products</button>
    <button class="tag-btn" onclick="filterByTag('Customers & Loyalty', this)">Customers</button>
    <button class="tag-btn" onclick="filterByTag('Sales Invoices & POS', this)">Sales Invoices</button>
    <button class="tag-btn" onclick="filterByTag('Orders & Quotations', this)">Orders & Quotations</button>
    <button class="tag-btn" onclick="filterByTag('Payments & Shifts', this)">Payments & Shifts</button>
    <button class="tag-btn" onclick="filterByTag('Expenses', this)">Expenses</button>
    <button class="tag-btn" onclick="filterByTag('Pharmacy & Medical', this)">Pharmacy</button>
    <button class="tag-btn" onclick="filterByTag('Inventory & Stock', this)">Stock</button>
    <button class="tag-btn" onclick="filterByTag('Suppliers & Purchasing', this)">Suppliers</button>
    <button class="tag-btn" onclick="filterByTag('Master Data & Setup', this)">Master Data</button>
    <button class="tag-btn" onclick="filterByTag('ZIMRA Fiscalization', this)">ZIMRA</button>
    <button class="tag-btn" onclick="filterByTag('Restaurant & KDS', this)">Restaurant</button>
    <button class="tag-btn" onclick="filterByTag('Subscriptions & Billing', this)">Subscriptions</button>
    <button class="tag-btn" onclick="filterByTag('Reports & Analytics', this)">Reports</button>
  </nav>

  <!-- Swagger UI Mount -->
  <main id="swagger-ui"></main>

  <!-- Auth Modal -->
  <div class="modal-bg" id="authModal">
    <div class="modal-box">
      <h3 class="modal-title">Authorize</h3>
      <input type="text" id="authKey" class="modal-input" placeholder="API Key / Username">
      <input type="password" id="authSecret" class="modal-input" placeholder="API Secret / Password">
      
      <div style="display:flex; justify-content:flex-end; gap:0.4rem; margin-top:0.4rem;">
        <button class="btn btn-dark" onclick="closeAuthModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveAuth()">Apply</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js"></script>
  <script>
    let ui;

    function getCustomServerUrl() {
      const el = document.getElementById('targetServerUrl');
      return (el && el.value ? el.value.trim().replace(/\/+$/, '') : 'https://backoffice.havano.pro');
    }

    window.onload = function() {
      // Force cache-busting timestamp on every page load
      const cacheBustSpecUrl = "openapi.json?t=" + new Date().getTime();

      ui = SwaggerUIBundle({
        url: cacheBustSpecUrl,
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 0,
        defaultModelExpandDepth: 0,
        docExpansion: "list",
        filter: true,
        showExtensions: false,
        tryItOutEnabled: true,
        persistAuthorization: true,
        requestInterceptor: function(req) {
          const targetServer = getCustomServerUrl();
          const defaultServer = "https://backoffice.havano.pro";

          // If the URL starts with default server, rewrite it to user-specified target server
          if (req.url.startsWith(defaultServer)) {
            req.url = req.url.replace(defaultServer, targetServer);
          }

          // If hosted on Vercel or any remote domain, proxy through /api/proxy to bypass browser CORS!
          if (window.location.protocol.startsWith('http') && !window.location.hostname.includes('localhost')) {
            // Only proxy if calling an external server
            if (req.url.startsWith('http://') || req.url.startsWith('https://')) {
              const fullTarget = req.url;
              req.url = window.location.origin + "/api/proxy?url=" + encodeURIComponent(fullTarget);
            }
          }
          return req;
        },
        onComplete: function() {
          setTimeout(function() {
            applyTagFilter('Frappe Core APIs');
          }, 250);
        }
      });
    };

    function onServerChange() {
      console.log("[Swagger] Server set to:", getCustomServerUrl());
    }

    function applyTagFilter(tag) {
      const filterInput = document.querySelector('.swagger-ui .filter-container input');
      if (filterInput) {
        filterInput.value = (tag === 'all' ? '' : tag);
        filterInput.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }

    function filterByTag(tag, el) {
      document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
      if (el) el.classList.add('active');
      applyTagFilter(tag);
    }

    function openAuthModal() {
      document.getElementById('authModal').style.display = 'flex';
    }

    function closeAuthModal() {
      document.getElementById('authModal').style.display = 'none';
    }

    function saveAuth() {
      const key = document.getElementById('authKey').value.trim();
      const sec = document.getElementById('authSecret').value.trim();
      if (!key || !sec) {
        alert("Enter both API key and secret.");
        return;
      }
      const tokenHeader = `token ${key}:${sec}`;
      if (ui && ui.authActions && ui.authActions.authorize) {
        ui.authActions.authorize({
          FrappeTokenAuth: {
            name: "FrappeTokenAuth",
            schema: { type: "apiKey", in: "header", name: "Authorization" },
            value: tokenHeader
          }
        });
        alert("Applied: " + tokenHeader);
      }
      closeAuthModal();
    }
  </script>
</body>
</html>
